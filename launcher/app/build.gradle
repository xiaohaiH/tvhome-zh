plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 19
        targetSdk 34
        versionCode 12
        versionName '1.6.1-kitkat.2'
        // Framework ImageView/TextView on KitKat cannot inflate <vector> resources.
        // AAPT keeps the vectors for API 21+ and packages generated PNGs below it.
        vectorDrawables {
            useSupportLibrary = false
            generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
        }
    }

    buildTypes {
        release {
            // Same switch upstream uses: R8 strips and optimises the code (AndroidX included),
            // resource shrinking drops what the launcher never references.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a
            // debug build instead of fighting it.
            signingConfig signingConfigs.debug
        }
        diagnostic {
            initWith release
            applicationIdSuffix '.diagnostic'
            versionNameSuffix '-diagnostic.1'
            matchingFallbacks = ['release']
            proguardFiles 'proguard-diagnostic.pro'
        }
    }

    signingConfigs {
        debug {
            // Use the normal local ~/.android/debug.keystore, not an upstream private key.
            // This key is stable on this machine, but cannot update upstream-signed APKs.
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    lint {
        // Never ship a call to an API unavailable on the KitKat baseline.
        fatal 'NewApi'
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
        // False positive: setHasFixedSize(true) is called on the desk grid only, whose size is the screen.
        // The Favourites panel's list really does need wrap_content — it is measured so the popup can be
        // as tall as its content — and lint cannot tell the two RecyclerViews apart.
        disable 'InvalidSetHasFixedSize'
    }

    packagingOptions {
        resources {
            // Kotlin metadata dragged in by AndroidX. This launcher is plain Java and never reads it;
            // leaving it out takes about 14 KB off every install. (Upstream does the same.)
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
